<div class="popupParent">
    <h4 mat-dialog-title class="modal-header text-center">
        <span class="header_text">
            {{ isEdit ? 'Edit Plant' : 'Add Plant' }}
        </span>
        <mat-icon class="close" matTooltip="close" (click)="closeDialog()" matDialogClose>close</mat-icon>
    </h4>
    <div class="container">
        <form [formGroup]="addPlantGrp" (ngSubmit)="addPlantGrp.valid ? addPlant(addPlantGrp.getRawValue()) : commonService.markFormGroupTouched(addPlantGrp)" class="row inpu_field_box">
            <div class="col-12">
                <mat-form-field appearance="outline">
                    <mat-label>Plant Name</mat-label>
                    <input matInput formControlName="pltTitle" [matAutocomplete]="plantAuto" (input)="onPlantNameInput()">
                    <mat-autocomplete #plantAuto="matAutocomplete">
                        <mat-option *ngFor="let plant of matchingPlants | async" [value]="plant.entityName" (onSelectionChange)="$event.isUserInput && selectExistingPlant(plant)">
                            {{ plant.entityName }}
                        </mat-option>
                    </mat-autocomplete>
                    <mat-error *ngIf="(addPlantGrp.get('pltTitle').invalid && addPlantGrp.get('pltTitle').touched)">{{getErrorMessage()}}</mat-error>
                </mat-form-field>
            </div>
            <div class="col-12 add_btn_box">
                <button type="button" class="cancel_btn" (click)="closeDialog()">Cancel</button>
                <button type="submit" class="add_btn">{{ isEdit ? 'Update' : 'Add New' }}</button>
            </div>
        </form>
    </div>
</div>
